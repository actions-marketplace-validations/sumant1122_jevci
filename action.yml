name: 'JevCI Quality Gate'
description: 'Sub-second code diff, commit, and doc quality gate powered by TypeSafe AI Jev SystemOne'
author: 'sumant1122'
inputs:
  typesafe-api-key:
    description: 'TypeSafe AI API key for Jev SystemOne model'
    required: true
  threshold:
    description: 'Minimum overall quality score required to pass build (0-100)'
    required: false
    default: '70'
  target:
    description: 'Git diff target range'
    required: false
    default: 'HEAD~1'
outputs:
  passed:
    description: 'Whether the quality gate passed (true/false)'
  overall-score:
    description: 'Overall quality score (0-100)'
  report-markdown:
    description: 'Markdown PR comment report generated by JevCI'
runs:
  using: 'node20'
  main: 'bin/jevci.js'
